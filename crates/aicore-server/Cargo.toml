[package]
name = "aicore-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aicore-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5.0"
aicore-protocol = { path = "../aicore-protocol" }
aicore-core = { path = "../aicore-core" }
aicore-storage = { path = "../aicore-storage" }
aicore-auth = { path = "../aicore-auth" }
aicore-provider-chatgpt = { path = "../aicore-providers/chatgpt" }
