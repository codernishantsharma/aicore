[package]
name = "aicore-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
aicore-protocol = { path = "../aicore-protocol" }
aicore-storage = { path = "../aicore-storage" }
aicore-auth = { path = "../aicore-auth" }
aicore-provider-chatgpt = { path = "../aicore-providers/chatgpt" }
