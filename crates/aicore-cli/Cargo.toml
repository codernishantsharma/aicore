[package]
name = "aicore-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aicore"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
directories = "5.0"
aicore-protocol = { path = "../aicore-protocol" }
