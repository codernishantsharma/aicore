[package]
name = "aicore-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
directories = "5.0"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
