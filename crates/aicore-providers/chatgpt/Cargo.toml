[package]
name = "aicore-provider-chatgpt"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
sha3 = "0.10"
hex = "0.4"
futures = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"
aicore-auth = { path = "../../aicore-auth" }
aicore-protocol = { path = "../../aicore-protocol" }
